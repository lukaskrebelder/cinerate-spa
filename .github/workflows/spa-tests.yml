# Automatische Tets für SPA mit GitHub Actions
# --> GitHub führt diese Schritte selbst in der Cloud aus und zeig am Ende an, ob alle Tests bestanden habe

name: SPA tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test